name: Competitor Intelligence Monitor

on:
  push:
    branches: [main]
    paths-ignore:
      - data.json
      - state.json
      - competitor_campaigns_latest.xlsx
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: competitor-monitor-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        run: python -m playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Preflight consistency check
        run: python preflight_check.py

      - name: Validate monitor configuration
        run: python monitor.py --validate-only

      - name: Collect competitor intelligence
        run: python monitor.py

      - name: Enrich, deduplicate and link sources
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python enhance.py

      - name: Postflight semantic check
        run: python postflight_check.py

      - name: Export approved Excel workbook
        run: python export_excel.py

      - name: Commit generated monitoring data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json state.json competitor_campaigns_latest.xlsx
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "chore: refresh competitor intelligence"
            git push origin HEAD:main
          fi

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/assets
          cp index.html competitor.html item.html data.json manual_overrides.json competitor_campaigns_latest.xlsx _site/
          cp -R assets/. _site/assets/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
