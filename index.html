<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bilingual competitor intelligence dashboard aligned with the approved campaign Excel inventory.">
  <title>Competitor Intelligence Dashboard</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header"><div class="site-header__inner">
    <a class="brand" href="index.html"><span class="brand__mark">CI</span><span><strong data-i18n="appTitle"></strong><small data-i18n="appSubtitle"></small></span></a>
    <div class="header-actions"><button id="export-edits" class="button button--ghost" data-i18n="exportEdits"></button><button id="import-edits" class="button button--ghost" data-i18n="importEdits"></button><input id="import-file" type="file" accept="application/json" hidden><button class="language-button" data-language-toggle></button></div>
  </div></header>

  <main class="page-shell">
    <div id="loading" class="loading-state"><span class="spinner"></span><span data-i18n="loading"></span></div><div id="error"></div>
    <div id="content" hidden>
      <section class="hero hero--executive"><div><span class="eyebrow" data-i18n="marketAnalysis"></span><h1 data-i18n="appTitle"></h1><p data-i18n="appSubtitle"></p></div><div class="hero__meta"><span id="last-check" class="meta-chip"></span><span id="inventory-meta" class="meta-chip"></span></div></section>

      <section class="compact-drawers">
        <details class="compact-drawer alert-drawer"><summary><span class="drawer-icon">🔔</span><strong id="alerts-summary-text"></strong><span id="alert-count" class="count-badge"></span></summary><div class="drawer-body"><div class="drawer-actions"><span data-i18n="alertsHint"></span><button id="mark-reviewed" class="button button--secondary" data-i18n="markReviewed"></button></div><div id="alerts-list" class="alert-list"></div></div></details>
        <details class="compact-drawer source-drawer"><summary><span class="drawer-icon">◉</span><strong data-i18n="sourceHealth"></strong><span id="source-health-summary" class="status-summary"></span></summary><div class="drawer-body"><p class="drawer-description" data-i18n="sourceHealthHint"></p><div id="source-list" class="source-list"></div></div></details>
      </section>


      <section class="section ai-summary-section" id="ai-summary-section">
        <div class="ai-summary-shell">
          <div class="ai-summary-head"><div><span class="eyebrow" data-i18n="aiInsight"></span><h2 data-i18n="aiMarketSummary"></h2></div><span id="ai-summary-meta" class="ai-summary-meta"></span></div>
          <p id="ai-summary-text" class="ai-summary-text"></p>
          <div id="ai-summary-bullets" class="ai-summary-bullets"></div>
        </div>
      </section>

      <section class="section" id="ai-strategic-section">
        <div class="section-heading"><div><span class="eyebrow" data-i18n="aiInsight"></span><h2 data-i18n="strategicIntelligence"></h2></div></div>
        <div class="intelligence-card-grid">
          <article class="intelligence-card"><h3 data-i18n="whatChanged"></h3><div id="ai-what-changed" class="intelligence-list"></div></article>
          <article class="intelligence-card"><h3 data-i18n="whyItMatters"></h3><div id="ai-why-matters" class="intelligence-list"></div></article>
          <article class="intelligence-card intelligence-card--accent"><h3 data-i18n="managementTakeaway"></h3><p id="ai-management-takeaway"></p></article>
          <article class="intelligence-card"><h3 data-i18n="weeklyBrief"></h3><p id="ai-weekly-brief"></p></article>
          <article class="intelligence-card intelligence-card--wide"><h3 data-i18n="opportunityGaps"></h3><div id="ai-opportunity-gaps" class="gap-grid"></div></article>
          <article class="intelligence-card intelligence-card--wide"><h3 data-i18n="categoryInsights"></h3><div id="ai-category-insights" class="category-insight-grid"></div></article>
        </div>
      </section>

      <section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="overview"></span><h2 data-i18n="marketAnalysis"></h2></div></div><div id="kpi-grid" class="kpi-grid"></div></section>

      <section class="section">
        <div class="section-heading"><div><span class="eyebrow" data-i18n="overview"></span><h2 data-i18n="activityScore"></h2><p data-i18n="activityScoreHint"></p></div></div>
        <div id="activity-score-grid" class="score-grid"></div>
      </section>

      <section class="section">
        <div class="insight-panel-grid">
          <article class="insight-panel"><header><h3 data-i18n="expiryWatch"></h3><p data-i18n="expiryWatchHint"></p></header><div id="expiry-watch-list" class="expiry-watch-list"></div></article>
          <article class="insight-panel"><header><h3 data-i18n="historicalTrend"></h3><p data-i18n="historicalTrendHint"></p></header><div id="market-history-chart" class="trend-chart-wrap"></div></article>
          <article class="insight-panel"><header><h3 data-i18n="categoryIntensity"></h3></header><div id="category-intensity-grid" class="intensity-grid"></div></article>
        </div>
      </section>

      <section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="marketingSignals"></span><h2 data-i18n="marketingSignals"></h2></div></div><div id="signal-grid" class="signal-grid"></div></section>

      <section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="marketAnalysis"></span><h2 data-i18n="campaigns"></h2></div></div>
        <div class="chart-grid">
          <article class="chart-card"><header><h3 data-i18n="campaignsByCompetitor"></h3><p data-i18n="activeCampaignsDetail"></p></header><div id="campaigns-chart" class="chart-body"></div></article>
          <article class="chart-card"><header><h3 data-i18n="categoryMix"></h3></header><div id="category-chart" class="chart-body"></div></article>
          <article class="chart-card"><header><h3 data-i18n="remittanceComparison"></h3></header><div id="remittance-chart" class="chart-body"></div></article>
          <article class="chart-card"><header><h3 data-i18n="merchantComparison"></h3><p data-i18n="merchantPortfolioDetail"></p></header><div id="merchant-chart" class="chart-body"></div></article>
          <article class="chart-card"><header><h3 data-i18n="mechanicsMix"></h3></header><div id="mechanics-chart" class="chart-body"></div></article>
          <article class="chart-card"><header><h3 data-i18n="expiryRisk"></h3></header><div id="expiry-chart" class="chart-body"></div></article>
          <article class="chart-card chart-card--wide"><header><h3 data-i18n="channelActivity7d"></h3><p data-i18n="shareOfVoice"></p></header><div id="channel-matrix" class="chart-body chart-body--scroll"></div></article>
          <article class="chart-card"><header><h3 data-i18n="platformCoverage"></h3><p data-i18n="socialLinkCount"></p></header><div id="platform-coverage-chart" class="chart-body"></div></article>
          <article class="chart-card chart-card--full"><header><h3 data-i18n="competitiveMatrix"></h3></header><div id="coverage-matrix" class="chart-body chart-body--scroll"></div></article>
        </div>
      </section>

      <section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="competitors"></span><h2 data-i18n="competitors"></h2></div></div><div id="competitor-grid" class="competitor-grid"></div></section>
      <section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="latestMedia"></span><h2 data-i18n="latestMedia"></h2></div></div><div id="media-grid" class="media-grid"></div></section>

      <section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="inventory"></span><h2 data-i18n="inventory"></h2></div><span id="result-count" class="result-meta"></span></div>
        <div class="tabs" id="content-tabs"><button class="tab is-active" data-type="campaign" data-i18n="campaigns"></button><button class="tab" data-type="merchant_offer" data-i18n="merchantOffers"></button><button class="tab" data-type="posts" data-i18n="posts"></button><button class="tab" data-type="review" data-i18n="review"></button><button class="tab" data-type="all" data-i18n="all"></button></div>
        <div class="filter-panel"><div class="filter-grid"><label><span data-i18n="search"></span><input id="search" type="search" data-i18n-placeholder="searchPlaceholder"></label><label><span data-i18n="competitors"></span><select id="competitor-filter"></select></label><label><span data-i18n="category"></span><select id="category-filter"></select></label><label><span data-i18n="source"></span><select id="source-filter"></select></label><button id="clear-filters" class="button button--ghost" data-i18n="clear"></button></div></div>
        <div id="item-list" class="item-list"></div>
      </section>
    </div>
  </main>
  <footer class="footer">Competitor Intelligence Dashboard · GitHub Pages</footer>
  <script src="assets/common.js" defer></script><script src="assets/index.js" defer></script>
</body>
</html>
