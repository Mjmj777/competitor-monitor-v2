<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Competitor Intelligence Dashboard</title><link rel="stylesheet" href="assets/styles.css"></head>
<body><header class="site-header"><div class="site-header__inner"><a class="brand" href="index.html"><span class="brand__mark">CI</span><span><strong data-i18n="appTitle"></strong><small data-i18n="appSubtitle"></small></span></a><div class="header-actions"><button id="add-campaign" class="button button--primary" data-i18n="addCampaign"></button><a class="button button--secondary" href="competitor_campaigns_latest.xlsx" download data-i18n="excelExport"></a><button id="delta-export" class="button button--ghost" data-i18n="deltaExport"></button><button id="export-edits" class="button button--ghost" data-i18n="exportEdits"></button><button id="import-edits" class="button button--ghost" data-i18n="importEdits"></button><input id="import-file" type="file" accept="application/json" hidden><button class="language-button" data-language-toggle></button></div></div></header>
<main class="page-shell"><div id="loading" class="loading-state"><span class="spinner"></span><span data-i18n="loading"></span></div><div id="error"></div><div id="content" hidden>
<section class="hero hero--executive"><div><span class="eyebrow" data-i18n="marketAnalysis"></span><h1 data-i18n="appTitle"></h1><p data-i18n="appSubtitle"></p><div class="hero-notes"><span><strong data-i18n="dataBasis"></strong> · <span data-i18n="dataBasisText"></span></span><span><strong data-i18n="excelAligned"></strong> · <span data-i18n="excelAlignedText"></span></span></div></div><div class="hero__meta"><span id="last-check" class="meta-chip"></span><span id="inventory-meta" class="meta-chip"></span></div></section>
<section class="compact-drawers"><details class="compact-drawer alert-drawer"><summary><span class="drawer-icon">🔔</span><strong data-i18n="alerts"></strong><span id="alert-count" class="count-badge"></span></summary><div class="drawer-body"><div class="drawer-actions"><span data-i18n="alertsHint"></span><button id="mark-reviewed" class="button button--secondary" data-i18n="markReviewed"></button></div><div id="alerts-list" class="alert-list"></div></div></details><details class="compact-drawer source-drawer"><summary><span class="drawer-icon">◉</span><strong data-i18n="sourceHealth"></strong><span id="source-health-summary" class="status-summary"></span></summary><div class="drawer-body"><p class="drawer-description" data-i18n="sourceHealthHint"></p><div id="source-list" class="source-list"></div></div></details></section>
<section class="section"><div id="kpi-grid" class="kpi-grid"></div></section>
<section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="aiSummary"></span><h2 data-i18n="aiSummary"></h2></div></div><div id="ai-summary" class="summary-grid"></div></section>
<section class="section"><div class="chart-grid"><article class="chart-card"><header><h3 data-i18n="campaignsByCompetitor"></h3></header><div id="campaigns-chart" class="chart-body"></div></article><article class="chart-card"><header><h3 data-i18n="categoryMix"></h3></header><div id="category-chart" class="chart-body"></div></article><article class="chart-card"><header><h3 data-i18n="remittanceComparison"></h3></header><div id="remittance-chart" class="chart-body"></div></article><article class="chart-card"><header><h3 data-i18n="merchantComparison"></h3></header><div id="merchant-chart" class="chart-body"></div></article><article class="chart-card"><header><h3 data-i18n="mechanicsMix"></h3></header><div id="mechanics-chart" class="chart-body"></div></article><article class="chart-card"><header><h3 data-i18n="expiryRisk"></h3></header><div id="expiry-chart" class="chart-body"></div></article><article class="chart-card chart-card--wide"><header><h3 data-i18n="channelActivity7d"></h3></header><div id="channel-matrix" class="chart-body chart-body--scroll"></div></article><article class="chart-card chart-card--full"><header><h3 data-i18n="competitiveMatrix"></h3></header><div id="coverage-matrix" class="chart-body chart-body--scroll"></div></article></div></section>
<section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="competitors"></span><h2 data-i18n="competitors"></h2></div></div><div id="competitor-grid" class="competitor-grid"></div></section>
<section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="latestMedia"></span><h2 data-i18n="latestMedia"></h2></div></div><div id="media-grid" class="media-grid"></div></section>
<section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="inventory"></span><h2 data-i18n="inventory"></h2></div><span id="result-count" class="result-meta"></span></div><div class="tabs" id="content-tabs"><button class="tab is-active" data-type="campaign" data-i18n="campaigns"></button><button class="tab" data-type="merchant_offer" data-i18n="merchantOffers"></button><button class="tab" data-type="posts" data-i18n="posts"></button><button class="tab" data-type="review" data-i18n="review"></button><button class="tab" data-type="all" data-i18n="all"></button></div><div id="bulk-review" class="bulk-review" hidden></div><div class="filter-panel"><div class="filter-grid"><label><span data-i18n="search"></span><input id="search" type="search" data-i18n-placeholder="searchPlaceholder"></label><label><span data-i18n="competitors"></span><select id="competitor-filter"></select></label><label><span data-i18n="category"></span><select id="category-filter"></select></label><label><span data-i18n="source"></span><select id="source-filter"></select></label><button id="clear-filters" class="button button--ghost" data-i18n="clear"></button></div></div><div id="item-list" class="item-list"></div></section>
</div></main><footer class="footer">Competitor Intelligence Dashboard</footer><script src="assets/common.js" defer></script><script src="assets/index.js" defer></script></body></html>
