name: Apply Admin Review
run-name: Admin review · ${{ inputs.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Request ID generated by Cloudflare Worker
        required: true
        type: string
      reviewer:
        description: Authenticated Admin username
        required: true
        type: string
      payload:
        description: Base64url-encoded review decision
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: competitor-monitor-cloudflare
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate request and apply review
        env:
          REVIEW_PAYLOAD: ${{ inputs.payload }}
          REVIEWER: ${{ inputs.reviewer }}
          REVIEW_REQUEST_ID: ${{ inputs.request_id }}
        run: python apply_review.py --payload "$REVIEW_PAYLOAD" --reviewer "$REVIEWER" --request-id "$REVIEW_REQUEST_ID"

      - name: Rebuild derived intelligence without network access
        env:
          CM_SKIP_NETWORK: "1"
        run: python enhance.py --competitor all

      - name: Validate generated result
        shell: bash
        run: |
          node --check assets/common.js
          node --check assets/review.js
          node --check cloudflare-worker.js
          node tests/worker_assets_test.mjs
          python postflight_check.py
          python tests/classification_regression_test.py
          python tests/review_apply_test.py --self-check

      - name: Export approved Excel workbook
        run: python export_excel.py

      - name: Commit persistent review decision
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual_overrides.json data.json state.json competitor_campaigns_latest.xlsx
          if git diff --cached --quiet; then
            echo "No review changes to commit."
          else
            git commit -m "chore: apply Admin review ${{ inputs.request_id }} [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt $attempt failed; rebasing safely on origin/main."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Review data conflicted with a newer main branch; refusing to overwrite it."
                exit 1
              fi
            done
            exit 1
          fi

      - name: Verify Cloudflare deployment settings
        env:
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_WORKER_NAME" || { echo "Missing repository variable CLOUDFLARE_WORKER_NAME"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Prepare Cloudflare static assets
        shell: bash
        run: |
          mkdir -p cloudflare-site/assets
          cp index.html competitor.html item.html review.html data.json competitor_campaigns_latest.xlsx cloudflare-site/
          cp -R assets/. cloudflare-site/assets/

      - name: Deploy Worker and site to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name ${{ vars.CLOUDFLARE_WORKER_NAME }}
