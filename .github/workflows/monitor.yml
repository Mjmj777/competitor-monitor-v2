name: Competitor Intelligence Monitor
run-name: Monitor ${{ inputs.competitor || 'all' }} · ${{ inputs.request_id || github.run_id }}

on:
  push:
    branches: [main]
    paths-ignore:
      - data.json
      - state.json
      - manual_overrides.json
      - competitor_campaigns_latest.xlsx
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      competitor:
        description: Competitor to refresh
        required: true
        default: all
        type: choice
        options:
          - all
          - stc-bank
          - barq
          - mobily-pay
          - tiqmo
          - urpay
          - alinma-pay
      request_id:
        description: Request ID generated by the Admin refresh control
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: competitor-monitor-pages
  # A code upload supersedes an older run; scheduled/Admin runs still queue safely.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Re-runs otherwise check out the original (possibly stale) event SHA,
          # which can make generated data conflict with a newer main branch.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        run: python -m playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node --check assets/common.js
          node --check assets/index.js
          node --check assets/competitor.js
          node --check assets/item.js
          node --check assets/review.js
          node --check cloudflare-worker.js
          node tests/chart_renderer_test.mjs
          node tests/worker_refresh_test.mjs
          node tests/worker_review_test.mjs
          python tests/classification_regression_test.py
          python tests/review_apply_test.py

      - name: Preflight consistency check
        run: python preflight_check.py

      - name: Validate monitor configuration
        run: python monitor.py --validate-only

      - name: Preserve last known-good generated data
        shell: bash
        run: |
          cp data.json "$RUNNER_TEMP/data.before-refresh.json"
          cp state.json "$RUNNER_TEMP/state.before-refresh.json"

      - name: Collect competitor intelligence
        env:
          TARGET_COMPETITOR: ${{ inputs.competitor || 'all' }}
          CM_REFRESH_REQUEST_ID: ${{ inputs.request_id || github.run_id }}
        run: python monitor.py --competitor "$TARGET_COMPETITOR" --request-id "$CM_REFRESH_REQUEST_ID"

      - name: Enrich, deduplicate and link sources
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TARGET_COMPETITOR: ${{ inputs.competitor || 'all' }}
          PYTHONUNBUFFERED: "1"
        run: python enhance.py --competitor "$TARGET_COMPETITOR"

      - name: Postflight semantic check
        run: python postflight_check.py

      - name: Export approved Excel workbook
        run: python export_excel.py

      - name: Commit generated monitoring data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json state.json competitor_campaigns_latest.xlsx
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "chore: refresh competitor intelligence (${{ inputs.competitor || 'all' }})"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt $attempt failed; rebasing safely on origin/main."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Generated data conflicted with a newer main branch; refusing to overwrite it."
                exit 1
              fi
            done
            echo "Could not push generated data after 3 attempts."
            exit 1
          fi

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/assets
          cp index.html competitor.html item.html review.html data.json competitor_campaigns_latest.xlsx _site/
          cp -R assets/. _site/assets/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
