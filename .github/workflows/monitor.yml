name: Competitor Intelligence Monitor

on:
  push:
    branches: [main]
    paths-ignore:
      - data.json
      - state.json
      - ai_summary.json
      - intelligence.json
      - market_history.json
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      force_ai:
        description: "Force one AI refresh even if no material change"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: competitor-intelligence-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate configuration
        run: python monitor.py --validate-only

      - name: Collect competitor intelligence
        run: python monitor.py

      - name: Build zero-cost intelligence metrics
        run: python build_intelligence_metrics.py

      - name: Generate AI intelligence package
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-sol
          OPENAI_REASONING_EFFORT: xhigh
          OPENAI_MAX_OUTPUT_TOKENS: "10000"
          AI_SUMMARY_FORCE: ${{ inputs.force_ai || 'false' }}
        run: python generate_ai_summary.py

      - name: Commit monitoring and intelligence data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json state.json ai_summary.json intelligence.json market_history.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh competitor intelligence"

          # A human edit or another run may update main after checkout.
          # Rebase the generated-data commit onto the latest main and retry safely.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi

            echo "Push was rejected; syncing with latest main (attempt ${attempt}/3)..."
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Automatic rebase failed. Aborting to avoid overwriting remote changes."
              git rebase --abort || true
              exit 1
            fi
          done

          echo "Push failed after 3 attempts."
          exit 1

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/assets
          cp index.html competitor.html item.html data.json ai_summary.json intelligence.json market_history.json manual_overrides.json _site/
          cp -R assets/. _site/assets/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
