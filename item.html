<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Offer or post analysis and change timeline.">
  <title>Item Analysis</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header"><div class="site-header__inner"><a class="brand" href="index.html"><span class="brand__mark">CI</span><span><strong data-i18n="appTitle"></strong><small data-i18n="appSubtitle"></small></span></a><div class="header-actions"><a class="button button--ghost" href="index.html" data-i18n="overview"></a><button class="language-button" data-language-toggle></button></div></div></header>
  <main class="page-shell"><div id="loading" class="loading-state"><span class="spinner"></span>Loading…</div><div id="error"></div><div id="content" hidden>
    <nav class="breadcrumb"><a id="back-link" href="index.html">← <span data-i18n="back"></span></a></nav>
    <section class="item-hero"><div><div id="hero-pills" class="pill-row"></div><h1 id="item-title"></h1><p id="item-snippet"></p></div><div class="item-hero__actions"><a id="external-link" class="button button--primary" target="_blank" rel="noopener noreferrer"></a></div></section>

    <section class="section item-detail-grid"><article class="detail-card"><h2 data-i18n="itemDetails"></h2><dl id="metadata"></dl></article><article class="detail-card"><h2 data-i18n="classification"></h2><div id="classification"></div></article><article class="detail-card detail-card--media"><h2 data-i18n="media"></h2><div id="media"></div></article></section>
    <section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="version"></span><h2 data-i18n="itemTimeline"></h2></div></div><div id="timeline" class="timeline"></div></section>
  </div></main>
  <footer class="footer">Competitor Intelligence Monitor · GitHub Pages</footer>
  <script src="assets/common.js" defer></script><script src="assets/item.js" defer></script>
