<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Competitor Analysis</title><link rel="stylesheet" href="assets/styles.css"></head>
<body>
<header class="site-header"><div class="site-header__inner"><a class="brand" href="index.html"><span class="brand__mark">CI</span><span><strong data-i18n="appTitle"></strong><small data-i18n="appSubtitle"></small></span></a><div class="header-actions"><button id="export-edits" class="button button--ghost" data-i18n="exportEdits"></button><a class="button button--ghost" href="index.html" data-i18n="overview"></a><button class="language-button" data-language-toggle></button></div></div></header>
<main class="page-shell"><div id="loading" class="loading-state"><span class="spinner"></span><span data-i18n="loading"></span></div><div id="error"></div><div id="content" hidden>
<nav class="breadcrumb"><a href="index.html">← <span data-i18n="back"></span></a></nav>
<section class="competitor-hero"><div><span class="eyebrow" data-i18n="marketAnalysis"></span><h1 id="competitor-name"></h1><p id="competitor-summary"></p></div><div class="competitor-hero__actions"><select id="competitor-switcher"></select><a id="offers-url" class="button button--secondary" target="_blank" rel="noopener noreferrer" data-i18n="officialOffers"></a><a id="website-url" class="button button--ghost" target="_blank" rel="noopener noreferrer" data-i18n="officialWebsite"></a></div></section>
<section class="section featured-offers-section"><div class="featured-offers-shell"><div class="section-heading featured-offers-heading"><div><span class="eyebrow" data-i18n="priorityView"></span><h2 data-i18n="currentOffers"></h2><p data-i18n="currentOffersHint"></p></div><span id="featured-offers-count" class="featured-offers-count"></span></div><div id="featured-offers-grid" class="featured-offers-grid"></div></div></section>
<section class="section ai-summary-section" id="ai-summary-section"><div class="ai-summary-shell ai-summary-shell--competitor"><div class="ai-summary-head"><div><span class="eyebrow" data-i18n="aiInsight"></span><h2 data-i18n="aiCompetitorSummary"></h2></div><span id="ai-summary-meta" class="ai-summary-meta"></span></div><p id="ai-summary-text" class="ai-summary-text"></p><div id="ai-summary-bullets" class="ai-summary-bullets"></div></div></section>
<section class="section" id="ai-competitor-detail-section"><div class="intelligence-card-grid intelligence-card-grid--competitor"><article class="intelligence-card intelligence-card--accent"><h3 data-i18n="positioning"></h3><p id="ai-positioning"></p></article><article class="intelligence-card"><h3 data-i18n="whatChanged"></h3><div id="ai-competitor-changes" class="intelligence-list"></div></article><article class="intelligence-card"><h3 data-i18n="watchpoints"></h3><div id="ai-watchpoints" class="intelligence-list"></div></article></div></section>
<section class="section"><div id="kpi-grid" class="kpi-grid"></div></section>
<section class="section"><div class="insight-panel-grid insight-panel-grid--competitor"><article class="insight-panel"><header><h3 data-i18n="activityScore"></h3><p data-i18n="activityScoreHint"></p></header><div id="competitor-score-detail"></div></article><article class="insight-panel"><header><h3 data-i18n="expiryWatch"></h3><p data-i18n="expiryWatchHint"></p></header><div id="competitor-expiry-watch" class="expiry-watch-list"></div></article><article class="insight-panel"><header><h3 data-i18n="historicalTrend"></h3><p data-i18n="historicalTrendHint"></p></header><div id="competitor-history-chart" class="trend-chart-wrap"></div></article></div></section>
<section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="marketingSignals"></span><h2 data-i18n="marketingSignals"></h2></div></div><div id="signal-grid" class="signal-grid"></div></section>
<section class="section"><div class="chart-grid"><article class="chart-card"><header><h3 data-i18n="categoryMix"></h3></header><div id="category-chart" class="chart-body"></div></article><article class="chart-card"><header><h3 data-i18n="mechanicsMix"></h3></header><div id="mechanics-chart" class="chart-body"></div></article><article class="chart-card"><header><h3 data-i18n="expiryRisk"></h3></header><div id="expiry-chart" class="chart-body"></div></article><article class="chart-card"><header><h3 data-i18n="channelActivity7d"></h3></header><div id="channel-chart" class="chart-body chart-body--scroll"></div></article></div></section>
<section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="latestMedia"></span><h2 data-i18n="latestMedia"></h2></div></div><div id="media-grid" class="media-grid"></div></section>
<section class="section"><details class="compact-drawer source-drawer"><summary><strong data-i18n="sourceHealth"></strong></summary><div class="drawer-body"><div id="source-list" class="source-list"></div></div></details></section>
<section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="inventory"></span><h2 data-i18n="inventory"></h2></div><span id="result-count" class="result-meta"></span></div>
<div class="tabs" id="content-tabs"><button class="tab is-active" data-type="campaign" data-i18n="campaigns"></button><button class="tab" data-type="merchant_offer" data-i18n="merchantOffers"></button><button class="tab" data-type="posts" data-i18n="posts"></button><button class="tab" data-type="review" data-i18n="review"></button><button class="tab" data-type="all" data-i18n="all"></button></div>
<div class="filter-panel"><div class="filter-grid"><label><span data-i18n="search"></span><input id="search" type="search" data-i18n-placeholder="searchPlaceholder"></label><label><span data-i18n="category"></span><select id="category-filter"></select></label><label><span data-i18n="status"></span><select id="status-filter"><option value="" data-i18n="all"></option><option value="Active">Active</option><option value="End Date Not Stated">End Date Not Stated</option><option value="Expiring ≤7 Days">Expiring ≤7 Days</option><option value="Expiring 8–30 Days">Expiring 8–30 Days</option><option value="Expired">Expired</option></select></label><button id="clear-filters" class="button button--ghost" data-i18n="clear"></button></div></div>
<div id="item-list" class="item-list"></div></section>
</div></main><footer class="footer">Competitor Intelligence Dashboard</footer><script src="assets/common.js" defer></script><script src="assets/competitor.js" defer></script></body></html>
