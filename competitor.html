<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Competitor Analysis</title><link rel="stylesheet" href="assets/styles.css?v=5.12.0"></head>
<body>
<header class="site-header"><div class="site-header__inner"><a class="brand" href="index.html"><span class="brand__mark">CI</span><span><strong data-i18n="appTitle"></strong><small data-i18n="appSubtitle"></small></span></a><div class="header-actions"><a class="button button--secondary" href="review.html" data-i18n="reviewCenter" data-admin-only hidden></a><button id="export-edits" class="button button--ghost" data-i18n="exportEdits"></button><a class="button button--ghost" href="index.html" data-i18n="overview"></a><button class="language-button" data-language-toggle></button></div></div></header>
<main class="page-shell"><div id="loading" class="loading-state"><span class="spinner"></span><span data-i18n="loading"></span></div><div id="error"></div><div id="content" hidden>
<nav class="breadcrumb"><a href="index.html">← <span data-i18n="back"></span></a></nav>
<section class="competitor-hero"><div class="competitor-hero__identity"><div class="competitor-hero__logo"><img id="competitor-logo" alt=""></div><div><span class="eyebrow" data-i18n="marketAnalysis"></span><h1 id="competitor-name"></h1><p id="competitor-summary"></p></div></div><div class="competitor-hero__actions"><button id="refresh-competitor" type="button" class="button button--primary" data-i18n="checkNow" data-refresh-control="true" data-admin-only hidden></button><button id="add-campaign" class="button button--primary" data-i18n="addCampaign"></button><select id="competitor-switcher"></select><a id="offers-url" class="button button--secondary" target="_blank" rel="noopener noreferrer" data-i18n="officialOffers"></a><a id="website-url" class="button button--ghost" target="_blank" rel="noopener noreferrer" data-i18n="officialWebsite"></a></div></section>
<section class="section"><div id="kpi-grid" class="kpi-grid"></div></section>
<section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="inventory"></span><h2 data-i18n="inventory"></h2></div><span id="result-count" class="result-meta"></span></div>
<div class="tabs" id="content-tabs"><button class="tab is-active" data-type="campaign" data-i18n="campaigns"></button><button class="tab" data-type="merchant_offer" data-i18n="merchantOffers"></button><button class="tab" data-type="posts" data-i18n="posts"></button><button class="tab" data-type="review" data-i18n="review" data-admin-only hidden></button><button class="tab" data-type="all" data-i18n="all"></button></div>
<div class="filter-panel"><div class="filter-grid"><label><span data-i18n="search"></span><input id="search" type="search" data-i18n-placeholder="searchPlaceholder"></label><label><span data-i18n="category"></span><select id="category-filter"></select></label><label><span data-i18n="status"></span><select id="status-filter"><option value="" data-i18n="all"></option><option value="Active">Active</option><option value="End Date Not Stated">End Date Not Stated</option><option value="Expiring ≤7 Days">Expiring ≤7 Days</option><option value="Expiring 8–30 Days">Expiring 8–30 Days</option><option value="Expired">Expired</option><option value="Merged" data-admin-only hidden>Merged</option></select></label><label data-admin-only hidden><span data-i18n="reviewReason"></span><select id="review-reason-filter"></select></label><button id="clear-filters" class="button button--ghost" data-i18n="clear"></button></div></div>
<div id="item-list" class="item-list"></div><button id="load-more" type="button" class="button button--secondary load-more" data-i18n="loadMore" hidden></button></section>
<section class="section"><div class="chart-grid"><article class="chart-card"><header><div><h3 data-i18n="categoryMix"></h3><p data-i18n="campaignMixNote"></p></div></header><div id="category-chart" class="chart-body"></div></article><article class="chart-card"><header><div><h3 data-i18n="mechanicsMix"></h3><p data-i18n="mechanicsMixNote"></p></div></header><div id="mechanics-chart" class="chart-body"></div></article><article class="chart-card"><header><div><h3 data-i18n="expiryRisk"></h3><p data-i18n="expiryRiskNote"></p></div></header><div id="expiry-chart" class="chart-body"></div></article><article class="chart-card chart-card--social"><header><div><h3 data-i18n="socialMediaActivity"></h3><p data-i18n="socialActivityNote"></p></div><div class="chart-toolbar"><label><span data-i18n="platform"></span><select id="competitor-social-platform-filter"><option value="" data-i18n="allPlatforms"></option><option value="instagram">Instagram</option><option value="facebook">Facebook</option><option value="x">X</option><option value="tiktok">TikTok</option></select></label><label><span data-i18n="chartPeriod"></span><select id="competitor-social-period-filter"><option value="7" data-i18n="last7Days"></option><option value="30" data-i18n="last30Days"></option></select></label></div></header><div id="competitor-social-comparison-summary" class="chart-comparison-summary"></div><div id="channel-chart" class="chart-body"></div></article></div></section>
<section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="latestMedia"></span><h2 data-i18n="latestMedia"></h2></div></div><div id="media-grid" class="media-grid"></div></section>
<section id="competitor-source-health" class="section" hidden><details class="compact-drawer source-drawer"><summary><strong data-i18n="sourceHealth"></strong><span id="source-summary" class="status-summary"></span></summary><div class="drawer-body"><div id="source-list" class="source-list"></div></div></details><details class="compact-drawer refresh-drawer"><summary><strong data-i18n="refreshHistory"></strong></summary><div class="drawer-body"><div id="refresh-history-list" class="refresh-history-list"></div></div></details></section>
</div></main><footer class="footer"><span>Competitor Intelligence Dashboard</span><a class="footer-signout" href="/__logout" data-i18n="signOut"></a></footer><script src="assets/common.js?v=5.12.0" defer></script><script src="assets/competitor.js?v=5.12.0" defer></script></body></html>
