<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detailed competitor intelligence page.">
  <title>Competitor Analysis</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header"><div class="site-header__inner"><a class="brand" href="index.html"><span class="brand__mark">CI</span><span><strong data-i18n="appTitle"></strong><small data-i18n="appSubtitle"></small></span></a><div class="header-actions"><a class="button button--ghost" href="index.html" data-i18n="overview"></a><button class="language-button" data-language-toggle></button></div></div></header>
  <main class="page-shell">
    <div id="loading" class="loading-state"><span class="spinner"></span>Loading…</div><div id="error"></div>
    <div id="content" hidden>
      <nav class="breadcrumb"><a href="index.html">← <span data-i18n="back"></span></a></nav>
      <section class="competitor-hero"><div><span class="eyebrow" data-i18n="analysisSummary"></span><h1 id="competitor-name"></h1><p id="competitor-summary"></p></div><div class="competitor-hero__actions"><select id="competitor-switcher"></select><a id="offers-url" class="button button--secondary" target="_blank" rel="noopener noreferrer" data-i18n="officialOffersPage"></a><a id="website-url" class="button button--ghost" target="_blank" rel="noopener noreferrer" data-i18n="officialWebsite"></a></div></section>
      <section class="section"><div id="kpi-grid" class="kpi-grid"></div></section>
      <section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="analysisSummary"></span><h2 data-i18n="quickView"></h2></div></div><div id="insight-grid" class="insight-grid"></div></section>
      <section class="section"><div class="chart-grid">
        <article class="chart-card"><header><h3 data-i18n="categories"></h3><p data-i18n="confirmedOffers"></p></header><div id="category-chart" class="chart-body"></div></article>
        <article class="chart-card"><header><h3 data-i18n="contentMix"></h3><p data-i18n="allContent"></p></header><div id="content-chart" class="chart-body"></div></article>
        <article class="chart-card chart-card--wide"><header><h3 data-i18n="activity30d"></h3><p data-i18n="initialImportNote"></p></header><div id="activity-chart" class="chart-body"></div></article>
        <article class="chart-card chart-card--wide"><header><h3 data-i18n="channelActivity7d"></h3><p data-i18n="socialShare"></p></header><div id="channel-chart" class="chart-body"></div></article>
      </div></section>
      <section class="section"><div class="section-heading"><div><span class="eyebrow" data-i18n="latest"></span><h2 data-i18n="latestMedia"></h2></div></div><div id="media-grid" class="media-grid"></div></section>
      <section class="section">
        <div class="section-heading"><div><span class="eyebrow" data-i18n="itemDetails"></span><h2 id="list-title" data-i18n="allContent"></h2></div><span id="result-count" class="result-meta"></span></div>
        <div class="tabs" id="content-tabs"><button class="tab is-active" data-type="offer" data-i18n="offers"></button><button class="tab" data-type="partner_offer" data-i18n="partnerOffers"></button><button class="tab" data-type="posts" data-i18n="posts"></button><button class="tab" data-type="review" data-i18n="reviewQueue"></button><button class="tab" data-type="all" data-i18n="allContent"></button></div>
        <div class="filter-panel"><div class="filter-grid"><label><span data-i18n="search"></span><input id="search" type="search" data-i18n-placeholder="searchPlaceholder"></label><label><span data-i18n="categories"></span><select id="category-filter"></select></label><label><span data-i18n="source"></span><select id="source-filter"></select></label><label><span data-i18n="status"></span><select id="status-filter"></select></label><button id="clear-filters" class="button button--ghost" data-i18n="clearFilters"></button></div></div>
        <div id="item-list" class="item-list"></div>
      </section>
      <section class="section"><details class="panel"><summary data-i18n="sourceDetails"></summary><div id="source-list" class="source-list"></div></details></section>
    </div>
  </main>
  <footer class="footer">Competitor Intelligence Monitor · GitHub Pages</footer>
  <script src="assets/common.js" defer></script><script src="assets/competitor.js" defer></script>
</body>
</html>
