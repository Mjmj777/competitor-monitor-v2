name: Competitor Intelligence Monitor

on:
  push:
    branches:
      - main
    paths-ignore:
      - data.json
      - state.json
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: competitor-monitor-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate configuration
        run: python monitor.py --validate-only

      - name: Collect competitor data
        run: python monitor.py

      - name: Commit monitoring history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json state.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update competitor intelligence data"
            git push origin HEAD:main
          fi

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html competitor.html item.html data.json _site/
          cp -R assets _site/assets
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
